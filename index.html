function igRepost(i){notify('已转发帖子')};function igSave(i){S.igSaved??={};S.igSaved[i]=!S.igSaved[i];render()};function igLike(i){S.likes['ig'+i]=!S.likes['ig'+i];render()};function igComment(i){S.insComment=i;S.insScreen='igcomment';render()};function igactivity(){let n=S.insNotifs;return `<header class="ighead">${back('ins')}<b>通知</b></header><main class="scroll activity">${(n.length?n:[{who:'won',text:'开始关注了你。'},{who:'friend',text:'赞了你的动态。'},{who:'buu',text:'分享了新照片。'}]).map(x=>`<div class="activityrow" onclick="igPerson('${x.who}')">${av(x.who)}<span><b>${x.who==='won'?'wonbin_ni':x.who==='buu'?'daily.buu':'daylight.note'}</b> ${x.text}</span></div>`).join('')}</main>`};function iginbox(){return `<header class="ighead">${back('ins')}<b>${esc(S.insname||S.name||'我的账号')}</b><span>✎</span></header><div class="search">⌕ 搜索</div><main class="scroll"><div class="igsubhead">消息 <small>陌生消息</small></div>${['won','buu','friend'].map(k=>`<button class="contact" onclick="openIgDm('${k}')">${av(k,'avatar','ig')}<div><b>${k==='won'?'wonbin_ni':k==='buu'?'daily.buu':'daylight.note'}</b><small>发送消息…</small></div></button>`).join('')}</main>`};function openIgDm(k){S.igChat=k;igGo('dm')};function igdm(){let k=S.igChat;return `<header class="ighead">${back('ins')}<span onclick="igPerson('${k}')">${av(k)} <b>${k==='won'?'wonbin_ni':k==='buu'?'daily.buu':'daylight.note'}</b></span></header><main class="scroll igdm"><div class="igidentity" onclick="igPerson('${k}')">${av(k,'largeavatar','ig')}<h3>${k==='won'?'wonbin_ni':k==='buu'?'daily.buu':'daylight.note'}</h3>${btn('查看主页',`igPerson('${k}')`,'action')}</div>${(S.igMessages?.[k]||[]).map(m=>`<div class="igbubble ${m.me?'me':''}">${esc(m.text)}</div>`).join('')}</main><form class="composer" onsubmit="sendIg(event)"><input id="iginput" placeholder="发消息…"><button>发送</button></form>`};function sendIg(e){e.preventDefault();let t=document.getElementById('iginput').value.trim();if(!t)return;S.igMessages??={};S.igMessages[S.igChat]??=[];S.igMessages[S.igChat].push({me:true,text:t});if(S.igChat==='won'&&!S.route){S.igMessages.won.push({me:false,text:'我有看到你的消息。'});S.triggered=true}render()};function igPerson(k){S.insPerson=k;igGo('profile')};function igprofile(){let k=S.insPerson||'self',self=k==='self',handle=self?(S.insname||S.name):k==='won'?'wonbin_ni':k==='buu'?'daily.buu':'daylight.note';return `<header class="ighead ig-profile-head">${back('ins')}<b>${esc(handle)}</b></header><main class="scroll igprofile"><div class="profileline">${av(k,'largeavatar','ig')}<div><b>${self?(S.myIgPosts?.length||0):3}</b><small>贴文</small></div><div><b>${self?0:128}</b><small>粉丝</small></div><div><b>${self?Object.values(S.following||{}).filter(Boolean).length:156}</b><small>关注中</small></div></div><div class="ig-person-name ${self?'mine':'other'}">${self?esc(S.name):k==='won'?'朴元彬':nameOf(k)}</div><div class="profilebuttons">${self?btn('编辑主页',"igGo('edit')")+btn('分享主页',"notify('已复制主页链接')"):btn(S.following[k]?'已关注':'关注',`followIg('${k}')`)+btn('发消息',`openIgDm('${k}')`)}</div><div class="igtiles">${(self?(S.myIgPosts||[]):['6642.jpeg','6627.jpeg','6644.jpeg']).map(p=>`<img src="${self?p:A+p}">`).join('')}</div></main>`};function followIg(k){S.following[k]=!S.following[k];render()};function igedit(){return `<header class="ighead">${back('ins')}<b>编辑主页</b></header><main class="scroll settings">${av('self','largeavatar','ig')}<input type="file" accept="image/*" id="up-insAvatar" onchange="readUpload(event,'insAvatar')" hidden>${btn('更换 Instagram 头像',"upload('insAvatar')",'action')}<label>用户名</label><input id="ignick" value="${esc(S.insname||S.name)}">${btn('保存',"saveProfile('ig')",'action')}<label>我的帖子</label><input type="file" accept="image/*" id="igpostupload" onchange="addMyIgPost(event)">${btn('返回我的主页',"igGo('selfprofile')",'action')}</main>`}
function addMyIgPost(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{S.myIgPosts??=[];S.myIgPosts.unshift(r.result);igGo('selfprofile')};r.readAsDataURL(f)};function photos(){let files=['IMG_3989.jpeg','IMG_4514.jpeg','6627.jpeg','6642.jpeg','6644.jpeg','IMG_5131(1).jpeg','IMG_5165.jpeg','IMG_5166.jpeg','IMG_5167.jpeg','IMG_5168.jpeg','IMG_5169.jpeg','IMG_5170.jpeg'];return shell(`<div class="photosapp">${topbar('照片')}<h2>图库</h2><main class="scroll photogrid">${files.map(p=>`<button onclick="viewPhoto('${p}')"><img src="${A+p}" onerror="this.parentNode.style.display='none'"></button>`).join('')}</main></div>`)};function viewPhoto(p){S.photo=p;nav('photo')};function photo(){return shell(`<div class="photosapp">${topbar('照片','photos')}<div class="photofull"><img src="${A+S.photo}"></div></div>`)};
function call(){let s=S.callState;return shell(`<div class="callpage ${s==='incoming'?'incoming':''}">${s==='incoming'?`<div class="callcenter">${av('won','largeavatar')}<h2>朴元彬</h2><p>邀请你视频通话..</p></div><div class="callchoices">${btn('☎',"declineCall()",'decline')}${btn('☎',"acceptCall()",'accept')}</div>`:s==='connected'?`<video id="callvideo" autoplay playsinline src="${A}copy_05F885A4-7ECC-4A3C-A22C-2D022FE41229.mp4" onended="finishCall()"></video><div class="calloverlay"><h3>朴元彬</h3><div class="callcontrols">${btn('♩',"void(0)")}${btn('◉',"void(0)")}${btn('▣',"void(0)")}${btn('☎',"finishCall()",'decline')}</div></div>`:`<div class="callcenter"><h2>您已挂断电话</h2></div>`}</div>`)};function declineCall(){S.callDeclined=true;S.callState='';S.page='wechat';S.messages.won.push({me:false,text:'没关系，等你方便再说。'});render()};function acceptCall(){S.callState='connected';render();document.getElementById('callvideo')?.play().catch(()=>{})};function finishCall(){S.callState='ended';S.page='call';render()};function triggerCall(){if(S.route)return;S.route='love';S.callState='incoming';S.page='call';render()};function triggerBe(){if(S.route)return;S.route='be';S.messages.won.push({me:false,text:'',type:'transfer'});S.messages.won.push({me:true,text:'？'});S.page='chat';S.chat='won';render()};function forcedNext(){if(!S.locked)return;let lines=[['buu','你在哪？怎么一直不回我'],['mom','今天给你打了好几个电话，怎么都没接？'],['dad','有事一定跟爸爸说。'],['buu','我真的很担心你，看到消息回我一下好不好'],['mom','我们在找你。你看到消息就回个字。']];let i=S.forcedStep||0;if(i>=lines.length)return;let [k,text]=lines[i];S.messages[k].push({me:false,text});S.forcedStep=i+1;render();setTimeout(forcedNext,3800)};function forced(){let msgs=['buu','mom','dad'].flatMap(k=>S.messages[k].slice(-3).map(m=>({k,...m}))).filter(m=>!m.me);return shell(`<div class="wxapp">${topbar('微信','forced')}<main class="scroll">${msgs.map(m=>`<div class="contact">${av(m.k)}<div><b>${nameOf(m.k)}</b><small>${esc(m.text)}</small></div></div>`).join('')}</main></div>`)};
function misc(){let p=S.page;if(p==='settings')return shell(`<div class="wxapp">${topbar('设置')}<main class="scroll settings">${btn('重新开始体验',"resetAll()",'action')}</main></div>`);if(p==='notes')return shell(`${topbar('备忘录')}<div class="settings"><h3>记得带</h3><p>充电宝、雨伞、耳机。</p></div>`);return shell(`${topbar(({camera:'相机',reminders:'提醒事项',clock:'时钟',calendar:'日历',maps:'地图',weather:'天气',store:'App Store',calculator:'计算器',phone:'电话',browser:'Safari',messages:'信息',music:'音乐'})[p]||p)}<div class="settings"><p>暂无内容</p></div>`)};function resetAll(){if(!confirm('确定重新开始？之前的聊天操作将重置。'))return;S=init();render()};
function render(){let p=S.page,html=p==='lock'?shell(`<div class="lockcontent" onclick="nav('pass')"><h1>${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</h1><p>${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</p><span>向上轻扫以解锁　⌃</span></div>`,'wallpaper'):p==='pass'?shell(`<div class="passpage"><h2>输入密码</h2><div class="passdots">${[0,1,2,3].map(i=>`<i class="${i<S.pass.length?'on':''}"></i>`).join('')}</div><div class="passgrid">${[1,2,3,4,5,6,7,8,9,'',0,'del'].map(n=>n===''?'<span></span>':btn(n==='del'?'⌫':n,`setPass('${n}')`)).join('')}</div></div>`,'wallpaper'):p==='setup'?shell(`<div class="setup"><h1>欢迎来到 you’s iphone</h1><p>请先设置你的名字</p><input id="username" maxlength="20" placeholder="输入名字"><button onclick="setup()">开始</button></div>`,'wallpaper'):p==='home'?home():p==='wechat'?wx():p==='chat'?chat():p==='wxsettings'?wxsettings():p==='moments'?moments():p==='comment'?commentPage():p==='postmoment'?postmoment():p==='coveredit'?coveredit():p==='ins'?ig():p==='photos'?photos():p==='photo'?photo():p==='call'?call():p==='forced'?forced():misc();el().innerHTML=html+(S.notice?`<div class="toast">${esc(S.notice)}</div>`:'');save();let c=document.getElementById('chatlog');if(c)c.scrollTop=c.scrollHeight}
